<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">HelpDesk AI Assistant</title>
  <desc id="desc">An English customer support chatbot interface mockup.</desc>
  <rect width="800" height="500" fill="#fef5e7"/>
  <rect x="118" y="36" width="564" height="428" rx="18" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/>
  <rect x="118" y="36" width="564" height="72" rx="18" fill="#1a1a1a"/>
  <circle cx="160" cy="72" r="19" fill="#2dd4bf"/><text x="151" y="80" fill="#1a1a1a" font-family="Arial, sans-serif" font-size="20" font-weight="700">AI</text>
  <text x="194" y="68" fill="#fffaf0" font-family="Arial, sans-serif" font-size="18" font-weight="700">HelpDesk Assistant</text>
  <text x="194" y="89" fill="#b8f3e9" font-family="Arial, sans-serif" font-size="12">Online now</text>
  <rect x="150" y="138" width="310" height="62" rx="14" fill="#fdebd0"/><text x="174" y="164" fill="#1a1a1a" font-family="Arial, sans-serif" font-size="14">Hi! How can I help today?</text><text x="174" y="184" fill="#6b6b6b" font-family="Arial, sans-serif" font-size="12">I can answer questions or book a call.</text>
  <rect x="336" y="224" width="298" height="54" rx="14" fill="#2dd4bf"/><text x="360" y="257" fill="#1a1a1a" font-family="Arial, sans-serif" font-size="14">I need help with my booking.</text>
  <rect x="150" y="304" width="340" height="62" rx="14" fill="#fdebd0"/><text x="174" y="330" fill="#1a1a1a" font-family="Arial, sans-serif" font-size="14">Of course. I found your appointment.</text><text x="174" y="350" fill="#6b6b6b" font-family="Arial, sans-serif" font-size="12">Would you like to reschedule it?</text>
  <rect x="150" y="400" width="468" height="38" rx="19" fill="#f4f4f4" stroke="#d4d4d4"/><text x="172" y="424" fill="#999999" font-family="Arial, sans-serif" font-size="13">Type your message...</text><circle cx="596" cy="419" r="13" fill="#ff6b4a"/><path d="M590 419h12M598 414l5 5-5 5" fill="none" stroke="#fff" stroke-width="2"/>
</svg>